services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - |
        npx prisma db push
        npx prisma db seed
        exec npm run dev -- -H 0.0.0.0 -p 3000
    container_name: union-rep-app
    ports:
      - "${APP_PORT:-3100}:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-unionrep}:${POSTGRES_PASSWORD:-unionrep}@postgres:5432/${POSTGRES_DB:-unionrep}?schema=app
      REDIS_URL: redis://${REDIS_USERNAME:-unionrep}:${REDIS_PASSWORD:-unionrep}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: union-rep-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unionrep}
      POSTGRES_USER: ${POSTGRES_USER:-unionrep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unionrep}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unionrep} -d ${POSTGRES_DB:-unionrep}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: union-rep-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-56379}:6379"
    command:
      - sh
      - -c
      - |
        printf '%s\n' \
          "user default off" \
          "user ${REDIS_USERNAME:-unionrep} on >${REDIS_PASSWORD:-unionrep} ~* +@all" \
          > /data/users.acl
        exec redis-server --appendonly yes --aclfile /data/users.acl
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli --user ${REDIS_USERNAME:-unionrep} --pass ${REDIS_PASSWORD:-unionrep} ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  app_node_modules:
  postgres_data:
  redis_data:
